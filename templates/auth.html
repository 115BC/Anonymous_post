{% extends "layout.html" %}
{% block title %}登录 / 注册{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h2>登录</h2>
    <form method="post" action="/login">
      <input name="username" placeholder="用户名或邮箱" required>
      <input name="password" type="password" placeholder="密码" required>
      <button>登录</button>
    </form>
  </div>
  <div class="card">
    <h2>注册（需邀请码）</h2>
    <form method="post" action="/register">
      <input name="username" placeholder="用户名" required>
      <input name="email" type="email" placeholder="邮箱" required>
      <input name="invite_code" placeholder="邀请码" required>
      <input name="password" type="password" placeholder="密码（至少6位）" required minlength="6">
      <button>注册</button>
    </form>
    <p style="font-size:12px;color:#6b7280">注册需填写邮箱与邀请码（邮箱验证暂未启用）。</p>
  </div>
</div>
{% endblock %}
