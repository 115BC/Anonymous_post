{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('home') if g.user else url_for('login') }}">
    {{ '回到首页' if g.user else '去登录' }}
  </a>
</div>
{% endblock %}
