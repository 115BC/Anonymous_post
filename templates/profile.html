{% extends "layout.html" %}
{% block title %}个人资料{% endblock %}
{% block content %}
<h1>个人资料</h1>
<div class="card">
  <div class="avatar" style="margin-bottom:12px">
    {% if user.avatar %}<img src="{{ url_for('static', filename='avatars/'~user.avatar) }}">
    {% else %}<div class="no-avatar">{{ user.username[0] }}</div>{% endif %}
  </div>
  <p><a class="btn" href="/profile/avatar">裁剪 / 更换头像</a></p>

  <form method="post" action="/profile" enctype="multipart/form-data">
    <label>用户名<input name="username" value="{{ user.username }}" required></label>
    <label>邮箱<input type="email" name="email" value="{{ user.email or '' }}" required></label>
    <label>角色<input value="{{ user.role }}" disabled></label>
    <button>保存修改</button>
  </form>
  <p class="hint">用户名与邮箱均不可与他人重复。</p>
</div>
{% endblock %}
