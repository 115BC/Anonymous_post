{% extends "layout.html" %}
{% block title %}{% if post %}编辑帖子{% else %}发帖{% endif %}{% endblock %}
{% block content %}
<h1>{% if post %}编辑帖子{% else %}发帖{% endif %}</h1>
<div class="card">
  <form method="post" action="" enctype="multipart/form-data">
    <label>标题<input name="title" value="{% if post %}{{ post.title }}{% endif %}" required></label>
    <label>所属分区
      <select name="category_id" required>
        <option value="">— 请选择分区 —</option>
        {% for c in categories %}<option value="{{ c.id }}" {% if post and post.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select>
    </label>
    <label>内容<textarea name="body" required>{% if post %}{{ post.body }}{% endif %}</textarea></label>
    <label>图片（可选）<input type="file" name="image" accept="image/*"></label>
    <button>提交</button>
  </form>
</div>
{% endblock %}
