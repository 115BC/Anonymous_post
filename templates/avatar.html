{% extends "layout.html" %}
{% block title %}编辑头像{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h2>编辑头像</h2>
  <div class="cur-avatar" id="curwrap">
    {% if user.avatar %}<img id="cur" src="{{ url_for('static', filename='avatars/'~user.avatar) }}" alt="当前头像">
    {% else %}<div class="no-avatar big">{{ user.username[0] }}</div>{% endif %}
  </div>

  <label>选择图片<input type="file" id="file" accept="image/*"></label>

  <div class="cropper">
    <canvas id="crop" width="320" height="320"></canvas>
  </div>
  <div class="crop-controls">
    <span>缩放</span>
    <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
  </div>
  <p class="hint">拖动图片调整位置，滑动滑块缩放；方形取景框内即为最终头像（将居中裁切为正方形）。</p>

  <div class="modal-actions">
    <a class="btn ghost" href="/profile">返回资料</a>
    <button id="save" type="button">保存头像</button>
  </div>
</div>

<script>
(function(){
  var canvas=document.getElementById('crop'), ctx=canvas.getContext('2d');
  var SIZE=canvas.width;
  var img=null, scale=1, minScale=1, ox=0, oy=0, dragging=false, lastX=0, lastY=0;
  var zoom=document.getElementById('zoom');

  function draw(){
    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.fillStyle='#1f2937'; ctx.fillRect(0,0,SIZE,SIZE);
    if(!img) return;
    ctx.save();
    ctx.translate(SIZE/2+ox, SIZE/2+oy);
    ctx.scale(scale,scale);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    ctx.restore();
  }
  function clamp(){
    if(!img) return;
    var hw=img.width*scale/2, hh=img.height*scale/2;
    var mx=hw-SIZE/2, my=hh-SIZE/2;
    if(mx>0){ ox=Math.max(-mx,Math.min(mx,ox)); } else { ox=0; }
    if(my>0){ oy=Math.max(-my,Math.min(my,oy)); } else { oy=0; }
  }
  function fit(){
    minScale=Math.max(SIZE/img.width, SIZE/img.height);
    scale=minScale; ox=0; oy=0;
    zoom.min=minScale.toFixed(3);
    zoom.max=(minScale*4).toFixed(3);
    zoom.value=scale;
    draw();
  }
  document.getElementById('file').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var url=URL.createObjectURL(f);
    img=new Image();
    img.onload=function(){ fit(); URL.revokeObjectURL(url); };
    img.onerror=function(){ alert('图片加载失败'); };
    img.src=url;
  });
  zoom.addEventListener('input', function(){ scale=parseFloat(zoom.value); clamp(); draw(); });
  canvas.addEventListener('pointerdown', function(e){
    if(!img) return; dragging=true; lastX=e.clientX; lastY=e.clientY;
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  });
  canvas.addEventListener('pointermove', function(e){
    if(!dragging) return;
    ox+=e.clientX-lastX; oy+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    clamp(); draw();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    canvas.addEventListener(ev, function(){ dragging=false; });
  });

  document.getElementById('save').addEventListener('click', function(){
    if(!img){ alert('请先选择图片'); return; }
    canvas.toBlob(function(blob){
      if(!blob){ alert('导出失败'); return; }
      var fd=new FormData();
      fd.append('avatar', blob, 'avatar.png');
      fetch('/profile/avatar', {method:'POST', body:fd})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && j.ok){
            document.getElementById('curwrap').innerHTML='<img id="cur" src="'+j.url+'?t='+Date.now()+'" alt="当前头像">';
            alert('头像已更新');
          } else { alert((j&&j.msg)||'保存失败'); }
        })
        .catch(function(){ alert('网络错误，请重试'); });
    }, 'image/png');
  });
})();
</script>
{% endblock %}
