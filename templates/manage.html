{% extends "layout.html" %}
{% block title %}管理{% endblock %}
{% block content %}
<h1>帖子管理（{{ session.role }}）</h1>
<p class="meta">管理员可删除帖子、修改帖子分类；超级管理员另可在“设置”中管理分区与邀请码。</p>
{% for p in posts %}
<div class="post">
  <h3><a href="/post/{{ p.id }}">{{ p.title }}</a></h3>
  <div class="meta">作者：{{ p.author }} | {{ p.created_at }}</div>
  <form method="post" action="/post/{{ p.id }}/category" style="display:inline">
    <select name="category_id">
      {% for c in categories %}<option value="{{ c.id }}" {% if c.id == p.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
    </select>
    <button type="submit">改分类</button>
  </form>
  <form method="post" action="/post/{{ p.id }}/delete" style="display:inline" onsubmit="return confirm('确认删除？');">
    <button class="danger" type="submit">删除</button>
  </form>
  <a href="/post/{{ p.id }}">查看</a>
</div>
{% else %}
  <p class="empty">暂无帖子。</p>
{% endfor %}
{% endblock %}
