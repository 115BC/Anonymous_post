{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == 'home' -%}
  <path d="M3.5 10.5 12 3.5l8.5 7v9a1 1 0 0 1-1 1h-5v-6.5h-5V21h-5a1 1 0 0 1-1-1z"/>
  {%- elif name == 'bell' -%}
  <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M10 20a2 2 0 0 0 4 0"/>
  {%- elif name == 'chat' -%}
  <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H8l-4.5 3v-6.2A8.5 8.5 0 1 1 21 11.5z"/>
  <path d="M8 12h.01M12 12h.01M16 12h.01"/>
  {%- elif name == 'heart' -%}
  <path d="M12 20.5s-7.5-4.7-9.6-9.5A5.2 5.2 0 0 1 12 5.7a5.2 5.2 0 0 1 9.6 5.3C19.5 15.8 12 20.5 12 20.5z"/>
  {%- elif name == 'leaf' -%}
  <path d="M4.5 19.5c9 0 15-6 15-15-9 0-15 6-15 15z"/><path d="M4.5 19.5C8 16 11 13 15 10.5"/>
  {%- elif name == 'shield' -%}
  <path d="M12 3.5 19 6v5.5c0 4.6-3 8.1-7 9.5-4-1.4-7-4.9-7-9.5V6z"/><path d="m9 11.8 2.2 2.2L15.2 10"/>
  {%- elif name == 'lock' -%}
  <rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
  {%- elif name == 'copy' -%}
  <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15H7"/>
  {%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>
  {%- elif name == 'pin' -%}
  <path d="M9 3.5h6l-1 6 3 3v1.5H7V12.5l3-3z"/><path d="M12 14v6.5"/>
  {%- elif name == 'arrow' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == 'plus' -%}
  <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'users' -%}
  <circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 20c0-3.2 2.5-5.2 5.5-5.2s5.5 2 5.5 5.2"/>
  <path d="M16 5.6a3 3 0 0 1 0 5.8M17.5 14.4c2 .5 3 2.3 3 5.1"/>
  {%- elif name == 'inbox' -%}
  <path d="M4 4.5h16l1.5 10.5h-5l-1.5 3h-6l-1.5-3h-5z"/><path d="M4.3 11h4.2l1.5 3h4l1.5-3h4.2"/>
  {%- elif name == 'edit' -%}
  <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 6.5 3 3"/>
  {%- elif name == 'trash' -%}
  <path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>
  {%- elif name == 'alert' -%}
  <path d="M12 3.8 21 20H3z"/><path d="M12 9v5M12 17.2h.01"/>
  {%- elif name == 'check' -%}
  <path d="m5 12.5 4.5 4.5L19 7.5"/>
  {%- elif name == 'back' -%}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
  {%- elif name == 'key' -%}
  <circle cx="8" cy="15.5" r="3.5"/><path d="m10.5 13 8-8M15.5 8l2.5 2.5M18 5.5 20.5 8"/>
  {%- elif name == 'book' -%}
  <path d="M5 4.5h9a3 3 0 0 1 3 3V20H8a3 3 0 0 0-3 3z" transform="translate(0 -1.5)"/>
  <path d="M5 18.5h12"/>
  {%- elif name == 'help' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.4a2.4 2.4 0 0 1 4.7.6c0 1.6-2.4 2-2.4 3.6"/>
  <path d="M12 17h.01"/>
  {%- elif name == 'folder' -%}
  <path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
  {%- elif name == 'download' -%}
  <path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 17.5v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/>
  {%- elif name == 'upload' -%}
  <path d="M12 15V5M8 9l4-4 4 4"/><path d="M5 17.5v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/>
  {%- elif name == 'file' -%}
  <path d="M6 3.5h7l5 5v12H6z"/><path d="M13 3.5v5h5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
