{% extends "layout.html" %}
{% block title %}网站设置{% endblock %}
{% block content %}
<h1>网站设置（超级管理员）</h1>

<section>
  <h2>基本信息</h2>
  <form method="post" action="/settings">
    <label>网站名称<input name="site_name" value="{{ config.site_name }}" required></label>
    <label>邀请码（注册时使用，可修改）<input name="invite_code" value="{{ config.invite_code }}" required></label>
    <button>保存设置</button>
  </form>
</section>

<section>
  <h2>帖子分区（类型）管理</h2>
  <ul>
    {% for c in categories %}<li style="margin:6px 0">{{ c.name }}
      <form method="post" action="/category/{{ c.id }}/delete" style="display:inline" onsubmit="return confirm('删除该分区？该分区下帖子将变为“未分类”。');">
        <button class="danger" type="submit">删除</button>
      </form>
    </li>{% endfor %}
  </ul>
  <form method="post" action="/category/new" style="margin-top:8px">
    <input name="name" placeholder="新分区名称" required style="max-width:240px;display:inline-block">
    <button type="submit">添加分区</button>
  </form>
</section>
{% endblock %}
