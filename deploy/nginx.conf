# 青禾 · 计师班班级空间 — Nginx 反向代理
# 使用前替换：server_name、证书路径、/opt/classsite 部署目录。
# 证书可用 certbot --nginx -d class.example.com 申请。

server {
    listen 80;
    listen [::]:80;
    server_name class.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name class.example.com;

    ssl_certificate     /etc/letsencrypt/live/class.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/class.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # 资源库单个文件上限 20 MB，留 2 MB 给表单开销。
    client_max_body_size 22m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 匿名反馈、树洞、问答、资源与账号入口不写访问日志。
    # 班长/管理员读取匿名反馈的页面同样关闭，避免日志把线程与时间关联起来。
    location ~ ^/(feedback|tree|qa|resources|account|login|register|admin/(feedback|resources))(/|$) {
        access_log off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 刻意不传 X-Real-IP / X-Forwarded-For：应用不需要，也避免下游误记录。
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        alias /opt/classsite/static/;
        access_log off;
        expires 7d;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8000;
    }
}
